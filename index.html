<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5321709544363319"
     crossorigin="anonymous"></script>
  <title>🏪 편의점 맛집 탐구</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg2: #f5f5f3;
      --bg3: #efefec;
      --text: #1a1a1a;
      --text2: #6b6b6b;
      --text3: #aaaaaa;
      --border: rgba(0,0,0,0.12);
      --border2: rgba(0,0,0,0.22);
      --info-bg: #e6f1fb;
      --info-text: #185fa5;
      --danger-bg: #fcebeb;
      --danger-text: #a32d2d;
      --radius-md: 8px;
      --radius-lg: 12px;
      --star: #EF9F27;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --bg2: #2c2c2e;
        --bg3: #3a3a3c;
        --text: #f0f0f0;
        --text2: #ababab;
        --text3: #6b6b6b;
        --border: rgba(255,255,255,0.12);
        --border2: rgba(255,255,255,0.22);
        --info-bg: #042c53;
        --info-text: #85b7eb;
        --danger-bg: #501313;
        --danger-text: #f09595;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg3);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    header { margin-bottom: 1.75rem; }
    header h1 { font-size: 24px; font-weight: 600; color: var(--text); }
    header p { font-size: 14px; color: var(--text2); margin-top: 4px; }

    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 10px 16px;
      font-size: 14px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      color: var(--text2);
      margin-bottom: -1px;
      transition: all 0.15s;
      font-family: inherit;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }
    .tab:hover:not(.active) { color: var(--text); }

    .section { display: none; }
    .section.active { display: block; }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-wrap { position: relative; flex: 1; min-width: 160px; }
    .search-wrap i {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      font-size: 16px; color: var(--text2); pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 1px solid var(--border2);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--text2); }

    .btn-add {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 14px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px; font-weight: 500;
      background: var(--text); color: var(--bg);
      cursor: pointer; white-space: nowrap;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .btn-add:hover { opacity: 0.8; }

    .cat-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
    .cat-btn {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border2);
      background: none; font-size: 13px;
      cursor: pointer; color: var(--text2);
      transition: all 0.15s; font-family: inherit;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--text); color: var(--bg); border-color: var(--text);
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .food-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem;
      cursor: pointer;
      transition: border-color 0.15s;
      display: flex; flex-direction: column; gap: 6px;
      position: relative;
    }
    .food-card:hover { border-color: var(--border2); }
    .food-card.selected { border: 2px solid #378ADD; }
    .food-emoji { font-size: 30px; text-align: center; }
    .food-name { font-size: 13px; font-weight: 500; color: var(--text); text-align: center; }
    .food-cat { font-size: 12px; color: var(--text2); text-align: center; }
    .food-stars { font-size: 12px; color: var(--star); text-align: center; }
    .food-avg { font-size: 12px; color: var(--text2); text-align: center; }
    .user-badge {
      position: absolute; top: 8px; right: 8px;
      background: var(--info-bg); color: var(--info-text);
      font-size: 10px; padding: 2px 6px; border-radius: 10px;
    }
    .del-btn {
      position: absolute; top: 6px; left: 6px;
      background: none; border: none;
      color: var(--text3); cursor: pointer;
      font-size: 14px; padding: 3px;
      border-radius: 4px; display: none;
      font-family: inherit;
    }
    .food-card:hover .del-btn { display: block; }
    .del-btn:hover { color: #E24B4A; background: var(--danger-bg); }

    .sel-info {
      background: var(--bg2); border-radius: var(--radius-md);
      padding: 12px 16px; margin-bottom: 1rem;
      display: flex; align-items: center; gap: 12px;
    }
    .sel-info-emoji { font-size: 24px; }
    .sel-info-name { font-size: 15px; font-weight: 500; color: var(--text); }
    .sel-info-cat { font-size: 13px; color: var(--text2); }

    .form-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem; margin-bottom: 1rem;
    }
    .form-label { font-size: 13px; color: var(--text2); margin-bottom: 8px; display: block; }
    .form-card input[type=text],
    .form-card textarea {
      width: 100%; font-family: inherit; font-size: 14px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border2); border-radius: var(--radius-md);
      padding: 8px 10px; outline: none;
      transition: border-color 0.15s;
    }
    .form-card input[type=text]:focus,
    .form-card textarea:focus { border-color: var(--text2); }
    .form-card textarea { min-height: 80px; resize: vertical; }

    .star-row { display: flex; gap: 2px; justify-content: center; margin: 8px 0; }
    .rating-display {
      font-size: 15px; font-weight: 500; color: var(--text);
      text-align: center; min-height: 22px;
    }

    .btn-primary {
      background: var(--text); color: var(--bg);
      border: none; border-radius: var(--radius-md);
      padding: 11px 24px; font-size: 14px; font-weight: 500;
      cursor: pointer; width: 100%; font-family: inherit;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.8; }

    .review-list { display: flex; flex-direction: column; gap: 10px; }
    .review-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
    }
    .review-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px; flex-wrap: wrap;
    }
    .r-name { font-size: 14px; font-weight: 500; color: var(--text); }
    .r-stars { font-size: 13px; color: var(--star); }
    .r-score { font-size: 13px; color: var(--star); font-weight: 500; }
    .r-author { font-size: 13px; color: var(--text2); }
    .r-text { font-size: 14px; color: var(--text); line-height: 1.6; }
    .r-date { font-size: 12px; color: var(--text3); margin-top: 6px; }

    .metric-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 1.5rem;
    }
    .metric {
      background: var(--bg2); border-radius: var(--radius-md);
      padding: 1rem; text-align: center;
    }
    .metric-val { font-size: 24px; font-weight: 600; color: var(--text); }
    .metric-lbl { font-size: 12px; color: var(--text2); margin-top: 2px; }

    .empty { text-align: center; padding: 2rem; color: var(--text3); font-size: 14px; }

    mark { background: #FAEEDA; border-radius: 2px; color: inherit; }
    @media (prefers-color-scheme: dark) {
      mark { background: #633806; }
    }

    /* Modal */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--bg);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      width: 360px; max-width: 95vw;
      border: 1px solid var(--border);
    }
    .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1rem; color: var(--text); }
    .field { margin-bottom: 12px; }
    .field label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 5px; }
    .field input, .field select {
      width: 100%; font-family: inherit; font-size: 14px;
      border: 1px solid var(--border2); border-radius: var(--radius-md);
      padding: 8px 10px;
      background: var(--bg); color: var(--text);
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--text2); }
    .emoji-grid {
      display: grid; grid-template-columns: repeat(8, 1fr);
      gap: 4px; max-height: 120px; overflow-y: auto;
    }
    .emoji-opt {
      font-size: 20px; cursor: pointer; text-align: center;
      padding: 4px; border-radius: 6px;
      border: 1.5px solid transparent;
    }
    .emoji-opt:hover { background: var(--bg2); }
    .emoji-opt.selected { border-color: #378ADD; background: var(--info-bg); }
    .modal-btns { display: flex; gap: 8px; margin-top: 1.25rem; }
    .btn-cancel {
      flex: 1; padding: 9px;
      border: 1px solid var(--border2);
      border-radius: var(--radius-md);
      background: none; cursor: pointer;
      font-size: 14px; color: var(--text2); font-family: inherit;
    }
    .btn-cancel:hover { background: var(--bg2); }
    .btn-confirm {
      flex: 2; padding: 9px;
      border: none; border-radius: var(--radius-md);
      background: var(--text); color: var(--bg);
      cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit;
    }
    .btn-confirm:hover { opacity: 0.8; }

    .no-select { text-align: center; padding: 1.5rem; color: var(--text3); font-size: 14px; }

    .rank-sort-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .rank-sort-btn {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg);
      cursor: pointer; text-align: left;
      transition: all 0.15s; font-family: inherit;
    }
    .rank-sort-btn:hover { border-color: var(--border2); background: var(--bg2); }
    .rank-sort-btn.active { border-color: #378ADD; background: var(--info-bg); }
    .rsb-icon { font-size: 20px; line-height: 1; margin-bottom: 2px; }
    .rsb-label { font-size: 13px; font-weight: 600; color: var(--text); }
    .rsb-desc { font-size: 11px; color: var(--text2); }
    .rank-sort-btn.active .rsb-label { color: #185fa5; }

    .rank-desc-box {
      font-size: 13px; color: var(--text2);
      background: var(--bg2); border-radius: var(--radius-md);
      padding: 10px 14px; margin-bottom: 1rem;
      display: none;
    }
    .rank-desc-box.show { display: block; }

    .rank-badge {
      font-size: 11px; padding: 2px 7px; border-radius: 10px;
      font-weight: 500; margin-left: 4px;
    }
    .badge-hot { background: #fff0e6; color: #c45b00; }
    .badge-new { background: #e6f4ea; color: #1a7a3a; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏪 편의점 맛집 탐구</h1>
    <p>편의점 음식의 별점과 리뷰를 남겨보세요</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('rate')">별점 남기기</button>
    <button class="tab" onclick="switchTab('browse')">전체 리뷰</button>
    <button class="tab" onclick="switchTab('ranking')">랭킹</button>
  </div>

  <!-- 별점 탭 -->
  <div id="tab-rate" class="section active">
    <div class="toolbar">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" id="search-rate" type="text" placeholder="음식 이름 검색..." oninput="renderFoodGrid()" />
      </div>
      <button class="btn-add" onclick="openModal()">
        <i class="ti ti-plus"></i> 음식 추가
      </button>
    </div>
    <div class="cat-filter" id="filter-rate"></div>
    <div class="food-grid" id="food-grid"></div>

    <div id="review-form" style="display:none;">
      <div class="sel-info">
        <span class="sel-info-emoji" id="sel-emoji"></span>
        <div>
          <div class="sel-info-name" id="sel-name"></div>
          <div class="sel-info-cat" id="sel-cat"></div>
        </div>
      </div>
      <div class="form-card">
        <label class="form-label">별점 선택</label>
        <div class="star-row" id="star-row"></div>
        <div class="rating-display" id="rating-disp"></div>
      </div>
      <div class="form-card">
        <label class="form-label">닉네임 (선택)</label>
        <input type="text" id="inp-author" placeholder="익명" maxlength="20" />
      </div>
      <div class="form-card">
        <label class="form-label">리뷰 작성</label>
        <textarea id="inp-review" placeholder="맛은 어땠나요? 자유롭게 남겨주세요 :)"></textarea>
      </div>
      <button class="btn-primary" onclick="submitReview()">리뷰 등록하기</button>
    </div>
    <div id="no-select" class="no-select">위에서 음식을 선택해주세요</div>
  </div>

  <!-- 리뷰 탭 -->
  <div id="tab-browse" class="section">
    <div class="toolbar">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" id="search-browse" type="text" placeholder="음식 이름 또는 리뷰 검색..." oninput="renderReviews()" />
      </div>
    </div>
    <div class="cat-filter" id="filter-browse"></div>
    <div class="review-list" id="review-list"></div>
  </div>

  <!-- 랭킹 탭 -->
  <div id="tab-ranking" class="section">
    <div class="metric-row" id="metrics"></div>

    <!-- 정렬 기준 선택 -->
    <div style="margin-bottom:1rem;">
      <div style="font-size:13px;color:var(--text2);margin-bottom:8px;">정렬 기준</div>
      <div class="rank-sort-btns">
        <button class="rank-sort-btn active" onclick="setRankSort(this,'avg')" title="별점 평균이 높은 순">
          <span class="rsb-icon">⭐</span>
          <span class="rsb-label">별점 높은 순</span>
          <span class="rsb-desc">평균 별점 기준</span>
        </button>
        <button class="rank-sort-btn" onclick="setRankSort(this,'cnt')" title="리뷰가 많은 순">
          <span class="rsb-icon">💬</span>
          <span class="rsb-label">리뷰 많은 순</span>
          <span class="rsb-desc">총 리뷰 수 기준</span>
        </button>
        <button class="rank-sort-btn" onclick="setRankSort(this,'hot')" title="최근 7일 화제성">
          <span class="rsb-icon">🔥</span>
          <span class="rsb-label">이번 주 화제</span>
          <span class="rsb-desc">최근 7일 리뷰 기준</span>
        </button>
        <button class="rank-sort-btn" onclick="setRankSort(this,'weighted')" title="리뷰 수와 별점을 함께 반영">
          <span class="rsb-icon">🏆</span>
          <span class="rsb-label">종합 점수</span>
          <span class="rsb-desc">별점 × 리뷰 수 반영</span>
        </button>
      </div>
    </div>

    <div id="rank-sort-desc" class="rank-desc-box"></div>
    <div class="review-list" id="ranking-list"></div>
  </div>
  <!-- 푸터 -->
  <footer style="margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border);text-align:center;font-size:13px;color:var(--text3);">
    © 2025 편의점 맛집 탐구 &nbsp;·&nbsp;
    <a href="privacy.html" style="color:var(--text2);text-decoration:none;">개인정보처리방침</a>
    &nbsp;·&nbsp;
    <a href="terms.html" style="color:var(--text2);text-decoration:none;">이용약관</a>
  </footer>
</div>

<!-- 음식 추가 모달 -->
<div class="modal-bg" id="add-modal" style="display:none;" onclick="closeBg(event)">
  <div class="modal">
    <h3>새 음식 추가</h3>
    <div class="field">
      <label>음식 이름</label>
      <input type="text" id="new-name" placeholder="예: 매콤불닭 삼각김밥" maxlength="30" />
    </div>
    <div class="field">
      <label>카테고리</label>
      <select id="new-cat" onchange="syncEmoji()">
        <option value="삼각김밥">🍙 삼각김밥</option>
        <option value="도시락">🍱 도시락</option>
        <option value="라면">🍜 라면</option>
        <option value="빵/디저트">🍞 빵/디저트</option>
        <option value="음료">🧃 음료</option>
        <option value="과자/스낵">🍿 과자/스낵</option>
        <option value="기타">📦 기타</option>
      </select>
    </div>
    <div class="field">
      <label>이모지 선택</label>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-confirm" onclick="addFood()">추가하기</button>
    </div>
  </div>
</div>

<script>
const EMOJIS = ['🍙','🍱','🍜','🍞','🥛','☕','🍿','🍫','🧃','🍔','🌮','🥪','🍳','🥚','🍗','🥩','🍕','🍣','🍦','🍰','🧁','🍩','🧇','🥐','🥜','🍪','🥤','🧋'];
const CAT_EMOJI = {'삼각김밥':'🍙','도시락':'🍱','라면':'🍜','빵/디저트':'🍞','음료':'🧃','과자/스낵':'🍿','기타':'📦'};
const LABELS = {0.5:'😱 최악',1:'😞 별로예요',1.5:'😕 조금 아쉬워요',2:'🙁 그냥 그래요',2.5:'😐 보통이에요',3:'😊 괜찮아요',3.5:'😄 맛있어요',4:'😍 진짜 맛있어요',4.5:'🤩 강력 추천!',5:'🏆 최고의 맛!'};

const DEFAULT_FOODS = [
  {id:1,name:'참치마요 삼각김밥',emoji:'🍙',cat:'삼각김밥',user:false},
  {id:2,name:'불고기 삼각김밥',emoji:'🍙',cat:'삼각김밥',user:false},
  {id:3,name:'명란젓 삼각김밥',emoji:'🍙',cat:'삼각김밥',user:false},
  {id:4,name:'소고기 도시락',emoji:'🍱',cat:'도시락',user:false},
  {id:5,name:'제육볶음 도시락',emoji:'🍱',cat:'도시락',user:false},
  {id:6,name:'신라면',emoji:'🍜',cat:'라면',user:false},
  {id:7,name:'불닭볶음면',emoji:'🍜',cat:'라면',user:false},
  {id:8,name:'짜파게티',emoji:'🍜',cat:'라면',user:false},
  {id:9,name:'소시지빵',emoji:'🍞',cat:'빵/디저트',user:false},
  {id:10,name:'크림치즈빵',emoji:'🍞',cat:'빵/디저트',user:false},
  {id:11,name:'바나나우유',emoji:'🥛',cat:'음료',user:false},
  {id:12,name:'아이스아메리카노',emoji:'☕',cat:'음료',user:false},
];

function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let foods = load('cvs_foods', DEFAULT_FOODS);
let reviews = load('cvs_reviews', []);
let selFood = null, curRating = 0, pickedEmoji = '🍙';
let foodCat = 'all', reviewCat = 'all';
let nextId = Math.max(...foods.map(f=>f.id), 100) + 1;

function starsHTML(s) {
  let h='';
  for(let i=1;i<=5;i++) h += s>=i?'★':s>=i-0.5?'⭑':'☆';
  return h;
}
function avg(id){
  const r=reviews.filter(x=>x.foodId===id);
  return r.length?r.reduce((a,b)=>a+b.score,0)/r.length:null;
}
function hl(t,q){
  if(!q)return t;
  return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
}

function getCats(){return['all',...new Set(foods.map(f=>f.cat))];}

function renderCatFilters(){
  const cats=getCats();
  ['filter-rate','filter-browse'].forEach(id=>{
    const isRate=id==='filter-rate';
    document.getElementById(id).innerHTML=cats.map(c=>`<button class="cat-btn${(isRate?foodCat:reviewCat)===c?' active':''}" onclick="${isRate?'setFoodCat':'setReviewCat'}(this,'${c}')">${c==='all'?'전체':(CAT_EMOJI[c]||'📦')+' '+c}</button>`).join('');
  });
}
function setFoodCat(btn,cat){
  foodCat=cat;
  document.querySelectorAll('#filter-rate .cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  selFood=null;
  document.getElementById('review-form').style.display='none';
  document.getElementById('no-select').style.display='';
  renderFoodGrid();
}
function setReviewCat(btn,cat){
  reviewCat=cat;
  document.querySelectorAll('#filter-browse .cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderReviews();
}

function renderFoodGrid(){
  const q=document.getElementById('search-rate').value.trim().toLowerCase();
  const filtered=foods.filter(f=>{
    const mc=foodCat==='all'||f.cat===foodCat;
    const mq=!q||f.name.toLowerCase().includes(q)||f.cat.toLowerCase().includes(q);
    return mc&&mq;
  });
  const grid=document.getElementById('food-grid');
  if(!filtered.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1">검색 결과가 없어요<br><small style="margin-top:4px;display:block">음식을 직접 추가해보세요!</small></div>`;return;}
  grid.innerHTML=filtered.map(f=>{
    const a=avg(f.id), cnt=reviews.filter(r=>r.foodId===f.id).length, sel=selFood&&selFood.id===f.id;
    return `<div class="food-card${sel?' selected':''}" onclick="selectFood(${f.id})">
      ${f.user?`<button class="del-btn" onclick="delFood(event,${f.id})" title="삭제"><i class="ti ti-x"></i></button><span class="user-badge">추가됨</span>`:''}
      <div class="food-emoji">${f.emoji}</div>
      <div class="food-name">${hl(f.name,q)}</div>
      <div class="food-cat">${f.cat}</div>
      <div class="food-stars">${a!==null?starsHTML(a):'☆☆☆☆☆'}</div>
      <div class="food-avg">${a!==null?a.toFixed(1)+'점 ('+cnt+'개)':'아직 리뷰 없음'}</div>
    </div>`;
  }).join('');
}

function delFood(e,id){
  e.stopPropagation();
  if(!confirm('이 음식을 삭제할까요? 관련 리뷰도 함께 삭제됩니다.'))return;
  foods=foods.filter(f=>f.id!==id);
  reviews=reviews.filter(r=>r.foodId!==id);
  save('cvs_foods',foods); save('cvs_reviews',reviews);
  if(selFood&&selFood.id===id){selFood=null;document.getElementById('review-form').style.display='none';document.getElementById('no-select').style.display='';}
  renderCatFilters(); renderFoodGrid();
}

function selectFood(id){
  selFood=foods.find(f=>f.id===id); curRating=0;
  renderFoodGrid();
  document.getElementById('sel-emoji').textContent=selFood.emoji;
  document.getElementById('sel-name').textContent=selFood.name;
  document.getElementById('sel-cat').textContent=selFood.cat;
  document.getElementById('review-form').style.display='block';
  document.getElementById('no-select').style.display='none';
  document.getElementById('inp-author').value='';
  document.getElementById('inp-review').value='';
  renderStars(0);
  document.getElementById('review-form').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderStars(hi){
  const c=document.getElementById('star-row'); c.innerHTML='';
  for(let i=1;i<=5;i++){
    const wrap=document.createElement('span');
    wrap.style.cssText='display:inline-flex;width:28px;';
    const s5=i-0.5, s6=i;
    const l=document.createElement('span');
    l.style.cssText=`display:inline-block;width:14px;overflow:hidden;font-size:32px;cursor:pointer;color:${hi>=s5?'#EF9F27':'#cccccc'}`;
    l.textContent='★'; l.onmouseenter=()=>renderStars(s5); l.onmouseleave=()=>renderStars(curRating); l.onclick=()=>{curRating=s5;renderStars(s5);updDisp();};
    const r=document.createElement('span');
    r.style.cssText=`display:inline-block;width:14px;overflow:hidden;font-size:32px;cursor:pointer;direction:rtl;color:${hi>=s6?'#EF9F27':'#cccccc'}`;
    r.textContent='★'; r.onmouseenter=()=>renderStars(s6); r.onmouseleave=()=>renderStars(curRating); r.onclick=()=>{curRating=s6;renderStars(s6);updDisp();};
    wrap.appendChild(l); wrap.appendChild(r); c.appendChild(wrap);
  }
  updDisp();
}
function updDisp(){
  const d=document.getElementById('rating-disp');
  if(!curRating){d.textContent='별점을 선택하세요';d.style.color='var(--text3)';return;}
  d.innerHTML=`<strong>${curRating}점</strong> — ${LABELS[curRating]||''}`;
  d.style.color='var(--text)';
}

function submitReview(){
  if(!selFood||!curRating)return;
  const author=document.getElementById('inp-author').value.trim()||'익명';
  const text=document.getElementById('inp-review').value.trim();
  const now=new Date();
  const ds=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  reviews.unshift({foodId:selFood.id,foodName:selFood.name,foodEmoji:selFood.emoji,foodCat:selFood.cat,score:curRating,author,text,date:ds});
  save('cvs_reviews',reviews);
  selFood=null; curRating=0;
  document.getElementById('review-form').style.display='none';
  document.getElementById('no-select').style.display='';
  renderFoodGrid();
  alert('리뷰가 등록되었습니다! 🎉');
}

function renderReviews(){
  const q=document.getElementById('search-browse').value.trim().toLowerCase();
  const filtered=reviews.filter(r=>{
    const mc=reviewCat==='all'||r.foodCat===reviewCat;
    const mq=!q||r.foodName.toLowerCase().includes(q)||r.text.toLowerCase().includes(q)||r.author.toLowerCase().includes(q);
    return mc&&mq;
  });
  const list=document.getElementById('review-list');
  if(!filtered.length){list.innerHTML=`<div class="empty">${q?'검색 결과가 없어요':'아직 리뷰가 없어요. 첫 번째 리뷰를 남겨보세요!'}</div>`;return;}
  list.innerHTML=filtered.map(r=>`
    <div class="review-item">
      <div class="review-header">
        <span style="font-size:18px">${r.foodEmoji}</span>
        <span class="r-name">${hl(r.foodName,q)}</span>
        <span class="r-stars">${starsHTML(r.score)}</span>
        <span class="r-score">${r.score}점</span>
        <span class="r-author">— ${r.author}</span>
      </div>
      ${r.text?`<div class="r-text">${hl(r.text,q)}</div>`:'<div class="r-text" style="color:var(--text3)">리뷰 내용 없음</div>'}
      <div class="r-date">${r.date}</div>
    </div>`).join('');
}

let rankSort = 'avg';

function setRankSort(btn, mode) {
  rankSort = mode;
  document.querySelectorAll('.rank-sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRanking();
}

function renderRanking(){
  const total = reviews.length;
  const avgAll = total ? (reviews.reduce((a,b)=>a+b.score,0)/total).toFixed(1) : '-';

  // 최근 7일 기준 날짜
  const now = new Date();
  const weekAgo = new Date(now - 7*24*60*60*1000);

  const ranked = foods.map(f => {
    const r = reviews.filter(x => x.foodId === f.id);
    // 최근 7일 리뷰
    const recentR = r.filter(x => {
      if (!x.date) return false;
      // date 형식: "2024.05.11 10:30"
      const parts = x.date.replace(/\./g,'-').replace(' ','T');
      return new Date(parts) >= weekAgo;
    });
    const avgScore = r.length ? r.reduce((a,b)=>a+b.score,0)/r.length : 0;
    // 종합 점수: 별점 × log(리뷰수+1) — 리뷰 수가 많을수록 가중치
    const weighted = r.length ? avgScore * Math.log(r.length + 1) : 0;
    return {
      ...f,
      avg: avgScore,
      cnt: r.length,
      recentCnt: recentR.length,
      recentAvg: recentR.length ? recentR.reduce((a,b)=>a+b.score,0)/recentR.length : 0,
      weighted,
    };
  }).filter(f => {
    if (rankSort === 'hot') return f.recentCnt > 0;
    return f.cnt > 0;
  });

  // 정렬
  const sortFns = {
    avg:      (a,b) => b.avg - a.avg || b.cnt - a.cnt,
    cnt:      (a,b) => b.cnt - a.cnt || b.avg - a.avg,
    hot:      (a,b) => b.recentCnt - a.recentCnt || b.recentAvg - a.recentAvg,
    weighted: (a,b) => b.weighted - a.weighted,
  };
  ranked.sort(sortFns[rankSort]);

  // 설명 문구
  const descs = {
    avg:      '⭐ 전체 리뷰의 평균 별점이 높은 순서로 정렬돼요.',
    cnt:      '💬 리뷰가 가장 많이 달린 음식 순서로 정렬돼요. 화제성 있는 메뉴를 한눈에!',
    hot:      '🔥 최근 7일 안에 리뷰가 가장 많이 달린 음식이에요. 지금 가장 뜨거운 메뉴!',
    weighted: '🏆 별점과 리뷰 수를 함께 반영한 종합 점수예요. 리뷰가 많고 별점도 높을수록 유리해요.',
  };
  const descEl = document.getElementById('rank-sort-desc');
  descEl.textContent = descs[rankSort];
  descEl.classList.add('show');

  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="metric-val">${total}</div><div class="metric-lbl">총 리뷰</div></div>
    <div class="metric"><div class="metric-val">${avgAll}</div><div class="metric-lbl">평균 별점</div></div>
    <div class="metric"><div class="metric-val">${foods.length}</div><div class="metric-lbl">등록 음식</div></div>`;

  const medals = ['🥇','🥈','🥉'];

  if (!ranked.length) {
    document.getElementById('ranking-list').innerHTML = `<div class="empty">${rankSort==='hot'?'최근 7일간 리뷰가 없어요!':'아직 리뷰가 없어요!'}</div>`;
    return;
  }

  document.getElementById('ranking-list').innerHTML = ranked.map((f,i) => {
    // 서브 텍스트 (정렬 기준에 따라 다르게 표시)
    let subInfo = '';
    if (rankSort === 'hot') {
      subInfo = `이번 주 리뷰 ${f.recentCnt}개 · 평균 ${f.recentAvg.toFixed(1)}점`;
    } else if (rankSort === 'cnt') {
      subInfo = `총 리뷰 ${f.cnt}개 · 평균 ${f.avg.toFixed(1)}점`;
    } else if (rankSort === 'weighted') {
      subInfo = `종합 ${f.weighted.toFixed(1)}점 (리뷰 ${f.cnt}개)`;
    } else {
      subInfo = `${f.cat} · ${f.cnt}개 리뷰`;
    }

    // 뱃지
    const isHot = f.recentCnt >= 2;
    const isNew = f.cnt <= 2 && f.cnt > 0;
    const badge = isHot && rankSort !== 'hot'
      ? `<span class="rank-badge badge-hot">🔥 이번 주 화제</span>`
      : isNew ? `<span class="rank-badge badge-new">🆕 신규</span>` : '';

    // 우측 점수 표시
    let scoreDisplay = '';
    if (rankSort === 'hot') {
      scoreDisplay = `<div style="font-size:16px;font-weight:500;color:var(--star)">${f.recentAvg.toFixed(1)}점</div><div style="font-size:12px;color:var(--star)">${starsHTML(f.recentAvg)}</div>`;
    } else {
      scoreDisplay = `<div style="font-size:16px;font-weight:500;color:var(--star)">${f.avg.toFixed(1)}점</div><div style="font-size:12px;color:var(--star)">${starsHTML(f.avg)}</div>`;
    }

    return `<div class="review-item" style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:22px;min-width:32px;text-align:center">${medals[i]||(i+1)+'위'}</span>
      <span style="font-size:22px">${f.emoji}</span>
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:500;display:flex;align-items:center;flex-wrap:wrap;gap:4px;">${f.name}${badge}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px;">${subInfo}</div>
      </div>
      <div style="text-align:right;">${scoreDisplay}</div>
    </div>`;
  }).join('');
}

function openModal(){
  document.getElementById('new-name').value='';
  document.getElementById('new-cat').value='삼각김밥';
  pickedEmoji='🍙'; renderEmojiGrid();
  document.getElementById('add-modal').style.display='flex';
  setTimeout(()=>document.getElementById('new-name').focus(),50);
}
function closeModal(){document.getElementById('add-modal').style.display='none';}
function closeBg(e){if(e.target.id==='add-modal')closeModal();}
function syncEmoji(){
  const cat=document.getElementById('new-cat').value;
  pickedEmoji=CAT_EMOJI[cat]||'📦'; renderEmojiGrid();
}
function renderEmojiGrid(){
  document.getElementById('emoji-grid').innerHTML=EMOJIS.map(em=>
    `<div class="emoji-opt${em===pickedEmoji?' selected':''}" onclick="pickEmoji('${em}')">${em}</div>`
  ).join('');
}
function pickEmoji(em){pickedEmoji=em;renderEmojiGrid();}
function addFood(){
  const name=document.getElementById('new-name').value.trim();
  if(!name){document.getElementById('new-name').focus();return;}
  const cat=document.getElementById('new-cat').value;
  if(foods.find(f=>f.name===name)){alert('이미 같은 이름의 음식이 있어요!');return;}
  foods.push({id:nextId++,name,emoji:pickedEmoji,cat,user:true});
  save('cvs_foods',foods); closeModal();
  renderCatFilters(); renderFoodGrid();
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['rate','browse','ranking'][i]===name));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='browse')renderReviews();
  if(name==='ranking')renderRanking();
}

renderCatFilters(); renderFoodGrid();
document.getElementById('no-select').style.display='';
</script>
</body>
</html>
